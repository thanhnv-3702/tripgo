spring:
  application:
    name: tripgo-api
  datasource:
    url: jdbc:h2:mem:tripgo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  cors:
    allowed-origins: http://localhost:3000
  jwt:
    secret: tripgo-dev-secret-change-in-production-min-32-chars
    expiration-ms: 86400000

---
# Use with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Requires docker compose up -d (Postgres)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/tripgo
    username: tripgo
    password: tripgo
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
